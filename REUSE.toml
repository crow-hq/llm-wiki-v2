version = 1
SPDX-PackageName = "llm-wiki-v2"
SPDX-PackageSupplier = "Federico Cesarini, Marco Sassarini"
SPDX-PackageDownloadLocation = "https://github.com/crow-hq/llm-wiki-v2"

# Licensing of the files that cannot carry a header (the demo and benchmark corpora; JSON; images and fonts) or that
# do not have one yet. NOTICE says the same in prose.
#
# When several tables match a file, the last one wins, so the general rules come first and the third-party
# exceptions after them. "aggregate" adds this information to any header already in the file, which stays valid.

# The project: AGPL-3.0-or-later.
[[annotations]]
path = [
    ".dockerignore",
    ".env.example",
    ".github/**",
    "AGENTS.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "CLAUDE.md",
    "CLA.md",
    "CONTRIBUTING.md",
    "Dockerfile",
    "NOTICE",
    "README.md",
    "SECURITY.md",
    "docker-compose.yml",
    "uv.lock",
    "benchmarks/**",
    "docs/**",
    "examples/**",
    "src/**",
    "tests/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Federico Cesarini, Marco Sassarini"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Carried over from OKF (Google LLC, Apache-2.0) and modified; the modifications are AGPL-3.0-or-later.
[[annotations]]
path = ["pyproject.toml", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Google LLC", "2026 Federico Cesarini, Marco Sassarini"]
SPDX-License-Identifier = "Apache-2.0 AND AGPL-3.0-or-later"

# The typed-decision prompt (TYPED_DECISIONS) is adapted from system-one-adapter.
[[annotations]]
path = "src/llmw2/models/typed.py"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Federico Cesarini, Marco Sassarini", "2026 TypeSafe AI"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"

# Adapted from the Contributor Covenant 2.1.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"

# Third-party JavaScript, shipped unmodified.
[[annotations]]
path = "src/llmw2/web/vendor/marked.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "2011-2024 Christopher Jeffrey"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/llmw2/web/vendor/purify.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "Cure53 and other contributors"
SPDX-License-Identifier = "Apache-2.0 OR MPL-2.0"

[[annotations]]
path = "src/llmw2/web/vendor/d3.min.js"
precedence = "aggregate"
SPDX-FileCopyrightText = "2010-2023 Mike Bostock"
SPDX-License-Identifier = "ISC"

# Fonts (latin subsets as packaged by Fontsource), shipped unmodified, with their licence in OFL.txt.
[[annotations]]
path = "src/llmw2/web/vendor/fonts/pixelify-sans-*.woff2"
precedence = "aggregate"
SPDX-FileCopyrightText = "2021 The Pixelify Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/llmw2/web/vendor/fonts/jetbrains-mono-*.woff2"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/llmw2/web/vendor/fonts/ibm-plex-sans-*.woff2"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/llmw2/web/vendor/fonts/OFL.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2021 The Pixelify Sans Project Authors",
    "2020 The JetBrains Mono Project Authors",
    "2019 IBM Corp.",
]
SPDX-License-Identifier = "OFL-1.1"
