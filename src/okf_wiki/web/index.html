<!-- llm-wiki-v2 local UI: browse the folder tree, read notes, ask, drop files to catalogue, set the model. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROW · LLM Wiki v2</title>
<link rel="icon" href="/web/img/crow.png">
<link href="/web/style.css" rel="stylesheet">
<script src="/web/vendor/marked.min.js"></script>
<script src="/web/vendor/purify.min.js"></script>
<script type="module" src="/web/app.js"></script>
</head>
<body>
<aside>
  <div class="brand">
    <a href="#"><img src="/web/img/crow.png" alt=""><div><h1>CROW</h1><small>LLM WIKI V2</small></div></a>
    <div class="models" id="models"></div>
  </div>
  <nav><div class="label">Catalogue</div><div id="tree"></div></nav>
  <div class="ledgers">
    <div class="label" style="padding:0">Tokens</div>
    <div class="ledger llm"><b>LLM</b><span class="bar"><i id="bar-llm"></i></span><span class="nums" id="num-llm"></span></div>
    <div class="ledger clf"><b>Classifier</b><span class="bar"><i id="bar-clf"></i></span><span class="nums" id="num-clf"></span></div>
  </div>
</aside>
<main>
  <header>
    <form id="ask"><input id="q" placeholder="Ask the wiki…" aria-label="Ask the wiki" autocomplete="off"><button class="btn">Ask →</button></form>
    <button class="btn ghost" id="brain"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2"/><circle cx="2.5" cy="3" r="1.5"/><circle cx="13.5" cy="4" r="1.5"/><circle cx="11" cy="13.5" r="1.5"/><path d="M6.5 7 3.6 4M9.8 7.3l2.4-2.3M8.9 9.8l1.4 2.4"/></svg>Brain</button>
    <button class="btn ghost" id="add" title="Write or paste a note">+ Note</button>
    <button class="btn ghost" id="pick" title="Add .txt, .md or .pdf files">↑ Files</button>
    <button class="btn ghost icon" id="gear" title="Model and key" aria-label="Settings" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <input type="file" id="files" multiple accept=".txt,.md,.markdown,.pdf" hidden>
  </header>
  <div id="view"></div>
</main>
<div id="overlay"><div>Drop to catalogue<small>.txt · .md · .pdf — the librarian files each one</small></div></div>
<div id="queue"></div>
<dialog id="dlg">
  <form method="dialog" id="addform">
    <h3>New note</h3>
    <p class="dlg-lead">Write or paste anything: the librarian files it in the right folder and links it to related notes.</p>
    <label for="t">Title <small>(optional)</small></label>
    <input id="t" placeholder="e.g. Pricing meeting, 12 June">
    <label for="txt">Text <small>(Markdown is fine)</small></label>
    <textarea id="txt" placeholder="What do you want the wiki to remember?" required></textarea>
    <div class="actions"><span class="dlg-hint">Ctrl+Enter to file it</span><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">File it →</button></div>
  </form>
</dialog>
</body>
</html>
