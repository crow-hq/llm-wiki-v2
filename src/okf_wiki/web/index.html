<!-- llm-wiki-v2 local UI: browse the folder tree, read notes, ask, drop files to catalogue, set the model. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-wiki</title>
<!-- Fonts are the only thing fetched from the internet; offline, the page falls back to Georgia. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link href="/web/style.css" rel="stylesheet">
<script src="/web/vendor/marked.min.js"></script>
<script src="/web/vendor/purify.min.js"></script>
<script type="module" src="/web/app.js"></script>
</head>
<body>
<aside>
  <div class="brand">
    <h1 onclick="location.hash=''">llm<span>·</span>wiki</h1>
    <div class="models" id="models"></div>
  </div>
  <nav><div class="label">Catalogue</div><div id="tree"></div></nav>
  <div class="ledgers">
    <div class="label" style="padding:0">Tokens</div>
    <div class="ledger llm"><b>LLM</b><span class="bar"><i id="bar-llm"></i></span><span class="nums" id="num-llm"></span></div>
    <div class="ledger clf"><b>Classifier</b><span class="bar"><i id="bar-clf"></i></span><span class="nums" id="num-clf"></span></div>
  </div>
</aside>
<main>
  <header>
    <form id="ask"><input id="q" placeholder="Ask the wiki…" autocomplete="off"><button class="btn">Ask</button></form>
    <button class="btn ghost" id="brain">◎ Brain</button>
    <button class="btn ghost" id="add">+ Text</button>
    <button class="btn ghost" id="pick">↑ Files</button>
    <button class="btn ghost" id="gear" title="Model and key" hidden>⚙ Settings</button>
    <input type="file" id="files" multiple accept=".txt,.md,.markdown,.pdf" hidden>
  </header>
  <div id="view"></div>
</main>
<div id="overlay"><div>Drop to catalogue<small>.txt · .md · .pdf — the librarian files each one</small></div></div>
<div id="queue"></div>
<dialog id="dlg">
  <form method="dialog" id="addform">
    <h3>Add a source</h3>
    <input id="t" placeholder="Title (optional)">
    <textarea id="txt" placeholder="Paste text or Markdown…" required></textarea>
    <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">File it</button></div>
  </form>
</dialog>
</body>
</html>
