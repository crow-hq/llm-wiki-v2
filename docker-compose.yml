#
# llm-wiki-v2 as a server: one container, any OpenAI-compatible provider.
#   cp .env.example .env          # choose the provider and set its key
#   docker compose up -d --build
#   wiki  http://localhost:8000   (API docs at /docs)
#   CLI   docker compose run --rm wiki okf-wiki ask "..."
# Your wiki is plain OKF markdown in ./wiki: browse it, edit it, git it.
# Settings come from .env here; the web page shows them but cannot change them.

name: llm-wiki-v2

services:
  wiki:
    build: .
    image: llm-wiki-v2
    ports:
      - "${OKF_PORT:-8000}:8000"
    env_file: # every OKF_* setting and provider key in .env
      - path: .env
        required: false
    environment:
      OKF_USAGE_LOG: /data/wiki/.usage.jsonl # one JSON line per model call, next to your wiki
    extra_hosts: # lets OKF_LLM_BASE_URL reach a model server on this machine (Ollama, vLLM, …)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./wiki:/data/wiki
    restart: unless-stopped
