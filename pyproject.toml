[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmw2"
dynamic = ["version"]  # one source: llmw2.__version__, also written into every note it generates
description = "LLM wiki in a Markdown format derived from the Open Knowledge Format: librarian, researcher and CROW classifier routing"
readme = "README.md"
license = "AGPL-3.0-or-later"  # SPDX expression; needs setuptools>=77, which also drops the License classifier
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]  # the Apache text must travel with the files taken from OKF
authors = [{ name = "Federico Cesarini" }, { name = "Marco Sassarini" }]
keywords = ["LLM wiki", "knowledge base", "Open Knowledge Format", "typed classifier", "CROW"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "fastapi>=0.110", "uvicorn>=0.29", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/crow-hq/llm-wiki-v2"
Repository = "https://github.com/crow-hq/llm-wiki-v2"
Issues = "https://github.com/crow-hq/llm-wiki-v2/issues"
Paper = "https://doi.org/10.5281/zenodo.22900601"
Changelog = "https://github.com/crow-hq/llm-wiki-v2/blob/main/CHANGELOG.md"

[project.scripts]
llmwiki2 = "llmw2.cli:main"

[tool.setuptools.dynamic]
version = { attr = "llmw2.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmw2 = ["agents/prompts/*/*.md", "web/*.html", "web/*.css", "web/*.js", "web/vendor/*.js", "web/vendor/fonts/*", "web/img/*", "demo/**/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140  # the code's own style: one statement per line, rarely wrapped
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]  # reads Field(default, …) as a default, as pydantic does
files = ["src/llmw2"]

[tool.coverage.run]
source = ["llmw2"]
branch = true

[tool.coverage.report]
fail_under = 95  # 97% today; the gate stops a slide, not a single untested line
skip_covered = true
show_missing = true
