[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-v2"
version = "0.2.0"
description = "LLM wiki in a Markdown format derived from the Open Knowledge Format: librarian, researcher and CROW classifier routing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.0", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
okf-wiki = "okf_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okf_wiki = ["prompts/*/*.md", "web/*.html", "web/*.css", "web/*.js", "web/vendor/*.js", "web/vendor/fonts/*", "web/img/*", "demo/*.md", "demo/*/*.md", "demo/*/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
