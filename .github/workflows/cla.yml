# Asks every outside contributor to accept CLA.md once, by a comment on their pull request,
# and records the signature in signatures/cla.json on main (so main must allow this bot's commits).
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:  # runs the workflow from main, never the pull request's code
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write  # commits the signatures file
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/crow-hq/llm-wiki-v2/blob/main/CLA.md
          branch: main
          allowlist: fed3c3sa,sassarini-marco,dependabot[bot]  # the owners need no licence from themselves
