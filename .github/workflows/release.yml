name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # a manual run publishes to TestPyPI: the rehearsal before the first real release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false  # a release must not restore a cache an earlier run could have poisoned
      # The tag must name the version the code carries, or PyPI gets a release nobody tagged.
      - name: The tag matches llmw2.__version__
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/llmw2/__init__.py)  # what llmw2.__version__ is, read without installing
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match version $version"; exit 1; }
      # The release notes are the version's CHANGELOG section, checked here so a missing one stops the release before PyPI.
      - name: The CHANGELOG has the release notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/ {f = index($0, "## [" v "]") == 1; next} /^\[[^]]*\]: / {f = 0} f' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
      - run: uv build
      # The wheel must carry the web page, the prompts and the demo, or `llmwiki2` starts without them.
      - run: |
          unzip -l dist/*.whl > files.txt
          for f in llmw2/web/index.html llmw2/agents/prompts/librarian/system.md llmw2/demo/index.md; do
            grep -q "$f" files.txt || { echo "missing from the wheel: $f"; exit 1; }
          done
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Tagged releases go to PyPI only when the repository variable PYPI_READY is true, set once trusted publishing works there.
    if: github.ref_type == 'tag' && vars.PYPI_READY == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow, no token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The GitHub release is made here, after PyPI, and never by hand: releases are immutable, so the copy of the CLA
  # signatures (they must not live on the cla-signatures branch alone) is attached to a draft before it is published.
  # To release, push the tag only.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the release and uploads its asset
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - uses: actions/checkout@v4
        with:
          ref: cla-signatures
          path: cla-signatures
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # no checkout of this repository here
          TAG: ${{ github.ref_name }}
        run: |
          cp cla-signatures/signatures/cla.json "cla-signatures-$TAG.json"
          gh release create "$TAG" --draft --verify-tag --title "${TAG#v}" --notes-file notes.md
          gh release upload "$TAG" "cla-signatures-$TAG.json"
          gh release edit "$TAG" --draft=false
